name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  test:
    name: Test and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Test Flask
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          bash -n scripts/build.sh scripts/up.sh
      - name: Build and test through Nginx
        run: |
          docker compose up --build --detach --wait --wait-timeout 120
          docker compose exec -T nginx nginx -t -c /tmp/nginx.conf
          python scripts/smoke.py
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    name: Push to ECR and deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: test-server-deployment
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      SERVER_URL: ${{ vars.SERVER_URL }}
      ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'hello-world' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: Build and push immutable images
        run: bash scripts/build.sh "$GITHUB_SHA"
      - name: Deploy through SSM and check rollout
        run: python3 scripts/deploy.py "$GITHUB_SHA"
      - name: Check the public website
        run: |
          for attempt in $(seq 1 15); do
            if python3 scripts/smoke.py "$SERVER_URL"; then
              printf 'Deployed `%s` to [%s](%s)\n' "$GITHUB_SHA" "$SERVER_URL" "$SERVER_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          exit 1
